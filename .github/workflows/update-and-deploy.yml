name: Actualizar stats y publicar web

on:
  # Sin escaneo automático: se lanza a mano cuando quieras datos frescos.
  workflow_dispatch:        # botón "Run workflow" (Actions) para escanear cod-tracker
    inputs:
      realms:
        description: "Reinos a pedir a cod-tracker (p. ej. 729-736). Vacío = todos."
        required: false
        default: ""
  push:                     # al cambiar el código se republica usando el ÚLTIMO escaneo guardado
    branches: [main]
    paths: ["data/**", "site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write   # guardar el histórico diario en data/history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de scraping
        run: pip install curl-cffi>=0.7.0
      - name: Descargar stats de cod-tracker
        # Uso autorizado por el responsable de cod-tracker. 1 petición al día.
        # Si falla (web caída o Turnstile activo), la web se genera igual con lo que haya.
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' && vars.COD_TRACKER_ENABLED != 'false' }}
        env:
          COD_TRACKER_REALMS: ${{ github.event.inputs.realms || vars.COD_TRACKER_REALMS }}
        run: python scripts/fetch_cod_tracker.py
      - name: Recoger stats y generar data.json
        env:
          # Opcional: endpoint JSON autorizado por una web de stats (Settings → Secrets → Actions)
          STATS_CSV_URLS: ${{ secrets.STATS_CSV_URLS }}   # p. ej. Google Sheet publicada como CSV
          STATS_API_URL: ${{ secrets.STATS_API_URL }}
          STATS_API_TOKEN: ${{ secrets.STATS_API_TOKEN }}
        run: python scripts/build_data.py
      - name: Guardar datos del escaneo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/stats/kingdoms_codtracker.csv data/stats/top_players_codtracker.csv
          if ! git diff --cached --quiet; then
            git commit -m "Escaneo de cod-tracker $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
